# Watchdog: tells your phone if the always-on computer stops updating the sheet.
#
# Only your own computer can see your Robinhood accounts, so only it writes
# "StockSage Today" to Drive. This job just looks at when that file last
# changed. It holds no broker credentials: the Drive token (read-only use here)
# and the private alert topic are its only secrets.

name: Watchdog

on:
  schedule:
    - cron: "30 15 * * 1-5"   # 10:30 CT, after the 08:30 and 09:45 runs: sheet + trader
    - cron: "45 17 * * 1-5"   # 12:45 CT: trader only
    - cron: "50 19 * * 1-5"   # 14:50 CT: trader only
  workflow_dispatch:

# actions: write lets the keep-alive step below re-enable the scheduled jobs.
# GitHub switches scheduled workflows off in a public repo after 60 days with no
# repository activity; re-enabling them every weekday resets that clock.
permissions:
  contents: read
  actions: write

jobs:
  watch:
    runs-on: ubuntu-24.04   # pinned: "latest" moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 10
    env:
      STOCKSAGE_DRIVE_TOKEN: ${{ secrets.STOCKSAGE_DRIVE_TOKEN }}
      STOCKSAGE_NTFY_TOPIC: ${{ secrets.STOCKSAGE_NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Is the sheet still being updated, and is the trader checking in?
        # The sheet is judged once a day (the first run, or by hand); the hourly
        # trader's heartbeat at every run.
        run: python -m stocksage watchdog ${{ (github.event_name == 'schedule' && github.event.schedule != '30 15 * * 1-5') && '--trader-only' || '' }}

      - name: Keep the scheduled jobs switched on
        # A reminder in your calendar is replaced by this. It must never fail the
        # watchdog, so a problem here is reported but not fatal.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for wf in watchdog.yml cloud-research.yml; do
            gh api --method PUT "repos/$REPO/actions/workflows/$wf/enable" \
              && echo "kept $wf enabled" \
              || echo "could not re-enable $wf (check the Actions tab)"
          done
